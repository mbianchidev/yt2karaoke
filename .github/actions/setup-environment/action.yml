name: Set up yt2karaoke test environment
description: Install Node, Python with uv, FFmpeg, CPU-only project dependencies and Chromium.

runs:
  using: composite
  steps:
    - name: Set up Node for YouTube extraction and JavaScript checks
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"

    - name: Set up Python and cached dependencies
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.7"
        python-version: "3.14"
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: |
          requirements.txt
          setup.py
          pyproject.toml

    - name: Install system media tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Install CPU-only project and browser dependencies
      shell: bash
      run: |
        uv pip install --torch-backend=cpu -e ".[dev]"
        uv pip check
        python -m playwright install --with-deps chromium
