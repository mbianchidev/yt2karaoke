<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yt2karaoke</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Reset & base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d1a;
      --surface:   #13132b;
      --border:    #2a2a55;
      --accent:    #8a2be2;
      --accent2:   #00d4ff;
      --text:      #e8e8ff;
      --muted:     #7070a0;
      --ready:     #00e676;
      --error:     #ff4444;
      --queued:    #ffb300;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------------ */
    /* Header                                                               */
    /* ------------------------------------------------------------------ */
    header {
      background: linear-gradient(135deg, #1a0033 0%, #000d2a 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.6rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    header .tagline {
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* ------------------------------------------------------------------ */
    /* Layout                                                               */
    /* ------------------------------------------------------------------ */
    .container {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.5rem;
      padding: 1.5rem;
      flex: 1;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }

    /* ------------------------------------------------------------------ */
    /* Player pane                                                          */
    /* ------------------------------------------------------------------ */
    .player-pane {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #main-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #no-video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--muted);
    }

    #no-video-placeholder .icon { font-size: 4rem; }

    .now-playing {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .now-playing .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .now-playing .song-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* ------------------------------------------------------------------ */
    /* Queue pane                                                           */
    /* ------------------------------------------------------------------ */
    .queue-pane {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .panel h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* Add song form */
    .add-form { display: flex; flex-direction: column; gap: 0.6rem; }

    .add-form input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.9rem;
      font-size: 0.9rem;
      width: 100%;
      transition: border-color 0.2s;
    }

    .add-form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #5500aa);
      color: #fff;
    }

    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 5px;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover { border-color: var(--accent2); color: var(--accent2); }

    /* Queue list */
    #queue-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 55vh; overflow-y: auto; }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      transition: border-color 0.2s;
    }

    .queue-item:hover { border-color: var(--accent); }

    .queue-item .song-name {
      flex: 1;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.READY      { background: var(--ready); }
    .status-dot.QUEUED     { background: var(--queued); }
    .status-dot.ERROR      { background: var(--error); }
    .status-dot.PROCESSING,
    .status-dot.DOWNLOADING { background: var(--accent2); animation: pulse 1s infinite; }
    .status-dot.PLAYING    { background: var(--accent); animation: pulse 0.6s infinite; }
    .status-dot.DONE       { background: var(--muted); }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    .queue-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }

    .empty-queue {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 1.5rem 0;
    }

    /* ------------------------------------------------------------------ */
    /* Toast notifications                                                  */
    /* ------------------------------------------------------------------ */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1.2rem;
      font-size: 0.875rem;
      opacity: 0;
      transform: translateX(30px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.error { border-color: var(--error); color: var(--error); }
    .toast.success { border-color: var(--ready); color: var(--ready); }

    /* ------------------------------------------------------------------ */
    /* Connection indicator                                                 */
    /* ------------------------------------------------------------------ */
    #conn-indicator {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--error);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    #conn-indicator.connected { background: var(--ready); }
  </style>
</head>
<body>

<header>
  <div id="conn-indicator" title="WebSocket connection"></div>
  <h1>🎤 yt2karaoke</h1>
  <span class="tagline">Turn any YouTube link into a karaoke experience</span>
</header>

<div class="container">

  <!-- Left: Player -->
  <section class="player-pane">
    <div id="video-wrapper">
      <video id="main-video" controls style="display:none;"></video>
      <div id="no-video-placeholder">
        <span class="icon">🎵</span>
        <span>Add a song to the queue to get started</span>
      </div>
    </div>

    <div class="now-playing">
      <div class="label">Now playing</div>
      <div class="song-title" id="now-playing-title">—</div>
    </div>
  </section>

  <!-- Right: Queue -->
  <aside class="queue-pane">

    <!-- Add song -->
    <div class="panel">
      <h2>Add Song</h2>
      <form class="add-form" id="add-form" onsubmit="addSong(event)">
        <input
          type="url"
          id="url-input"
          placeholder="https://youtube.com/watch?v=..."
          required
        />
        <input
          type="text"
          id="title-input"
          placeholder="Title (optional)"
        />
        <button type="submit" class="btn btn-primary" id="add-btn">
          ➕ Add to Queue
        </button>
      </form>
    </div>

    <!-- Queue list -->
    <div class="panel" style="flex:1;">
      <h2>Queue</h2>
      <div id="queue-list"></div>
    </div>

  </aside>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ------------------------------------------------------------------ //
// State                                                                //
// ------------------------------------------------------------------ //
let currentSongId = null;

// ------------------------------------------------------------------ //
// SocketIO                                                             //
// ------------------------------------------------------------------ //
const socket = io();

socket.on('connect', () => {
  document.getElementById('conn-indicator').classList.add('connected');
});

socket.on('disconnect', () => {
  document.getElementById('conn-indicator').classList.remove('connected');
});

socket.on('queue_update', (songs) => {
  renderQueue(songs);
  // Auto-play first READY song if nothing is playing
  autoPlay(songs);
});

// ------------------------------------------------------------------ //
// Queue rendering                                                      //
// ------------------------------------------------------------------ //
function renderQueue(songs) {
  const list = document.getElementById('queue-list');
  if (!songs || songs.length === 0) {
    list.innerHTML = '<div class="empty-queue">Queue is empty — add a YouTube URL above</div>';
    return;
  }

  list.innerHTML = songs.map(s => `
    <div class="queue-item" id="qi-${escHtml(s.id)}"
         data-id="${escHtml(s.id)}"
         data-title="${escHtml(s.title || s.url)}"
         data-status="${escHtml(s.status)}">
      <div class="status-dot ${escHtml(s.status)}" title="${escHtml(s.status)}"></div>
      <span class="song-name" title="${escHtml(s.title || s.url)}">${escHtml(s.title || s.url)}</span>
      <div class="queue-actions">
        ${s.status === 'READY' ? `<button class="btn btn-sm btn-primary action-play" title="Play">▶</button>` : ''}
        ${s.status === 'QUEUED' ? `
          <button class="btn btn-sm btn-ghost action-up" title="Move up">↑</button>
          <button class="btn btn-sm btn-ghost action-down" title="Move down">↓</button>
          <button class="btn btn-sm btn-ghost action-remove" title="Remove">✕</button>
        ` : ''}
        ${s.status === 'ERROR' ? `<span title="${escHtml(s.error || '')}" style="color:var(--error);font-size:0.75rem;">⚠ Error</span>` : ''}
      </div>
    </div>
  `).join('');

  // Attach event listeners using data attributes (no inline onclick interpolation)
  list.querySelectorAll('.queue-item').forEach(item => {
    const id    = item.dataset.id;
    const title = item.dataset.title;
    item.querySelector('.action-play')?.addEventListener('click', () => playSong(id, title));
    item.querySelector('.action-up')?.addEventListener('click',   () => moveUp(id));
    item.querySelector('.action-down')?.addEventListener('click', () => moveDown(id));
    item.querySelector('.action-remove')?.addEventListener('click', () => removeSong(id));
  });
}

function autoPlay(songs) {
  if (currentSongId) return; // already playing
  const ready = songs.find(s => s.status === 'READY');
  if (ready) playSong(ready.id, ready.title || ready.url);
}

// ------------------------------------------------------------------ //
// Player                                                               //
// ------------------------------------------------------------------ //
function playSong(id, title) {
  const video = document.getElementById('main-video');
  const placeholder = document.getElementById('no-video-placeholder');
  const nowPlaying = document.getElementById('now-playing-title');

  currentSongId = id;
  video.src = `/video/${id}`;
  video.style.display = 'block';
  placeholder.style.display = 'none';
  nowPlaying.textContent = title || id;
  video.play().catch(() => {});

  video.onended = () => {
    // Play next ready song automatically
    fetch('/api/queue').then(r => r.json()).then(songs => {
      const idx = songs.findIndex(s => s.id === id);
      const next = songs.slice(idx + 1).find(s => s.status === 'READY');
      if (next) {
        playSong(next.id, next.title || next.url);
      } else {
        currentSongId = null;
        video.style.display = 'none';
        placeholder.style.display = 'flex';
        nowPlaying.textContent = '—';
      }
    });
  };
}

// ------------------------------------------------------------------ //
// Queue actions                                                        //
// ------------------------------------------------------------------ //
async function addSong(event) {
  event.preventDefault();
  const url = document.getElementById('url-input').value.trim();
  const title = document.getElementById('title-input').value.trim();
  if (!url) return;

  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  btn.textContent = 'Adding…';

  try {
    const resp = await fetch('/api/queue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, title })
    });

    if (resp.ok) {
      document.getElementById('url-input').value = '';
      document.getElementById('title-input').value = '';
      toast('Song added to queue!', 'success');
    } else {
      const err = await resp.json().catch(() => ({ description: 'Unknown error' }));
      toast(err.description || 'Failed to add song', 'error');
    }
  } catch (e) {
    toast('Network error', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '➕ Add to Queue';
  }
}

async function removeSong(id) {
  await fetch(`/api/queue/${id}`, { method: 'DELETE' });
}

async function moveUp(id) {
  await fetch(`/api/queue/${id}/up`, { method: 'POST' });
}

async function moveDown(id) {
  await fetch(`/api/queue/${id}/down`, { method: 'POST' });
}

// ------------------------------------------------------------------ //
// Toast                                                                //
// ------------------------------------------------------------------ //
function toast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  }, 3500);
}

// ------------------------------------------------------------------ //
// Utilities                                                            //
// ------------------------------------------------------------------ //
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Initial load
fetch('/api/queue').then(r => r.json()).then(renderQueue);
</script>

</body>
</html>
